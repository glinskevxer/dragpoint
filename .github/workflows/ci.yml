name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m dragpoint.tools.check_docstrings
      - run: python -m dragpoint.tools.check_layers
      - run: python -m dragpoint.tools.check_naming
      - run: python -m dragpoint.tools.check_tests
      - run: python -m dragpoint.tools.check_wiring
      - name: the shipped faces still obey their own headers
        run: python -m dragpoint.tools.check_face

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m dragpoint.tools.build_architecture --check
      - run: python -m dragpoint.tools.build_commands --check
      - run: python -m dragpoint.tools.build_crib --check
      - run: python -m dragpoint.tools.build_rules --check
      - name: fail if regenerating changes anything
        run: |
          python -m dragpoint.tools.build_architecture
          python -m dragpoint.tools.build_commands
          python -m dragpoint.tools.build_crib
          python -m dragpoint.tools.build_rules
          git diff --exit-code docs/

  tests:
    # Three operating systems because the things that differ between them are
    # all things this package does: the line endings a posted program is
    # written with, whether a path with a drive letter survives a round trip,
    # and how the platform rounds the last place of a float it prints.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=95
      - run: python -m dragpoint.tools.smoke

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build --wheel --sdist
      - name: install the wheel into a clean environment and cut something
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/dragpoint --version
          /tmp/fresh/bin/dragpoint crib cutters
          /tmp/fresh/bin/dragpoint crib stock
          /tmp/fresh/bin/dragpoint font measure --cap-height 3mm "FEED PUMP 1"
          /tmp/fresh/bin/dragpoint plate check --size 60x20mm "FEED PUMP 1" RUN
          /tmp/fresh/bin/dragpoint plate post --size 60x20mm "FEED PUMP 1" RUN > /tmp/plate.nc
          test -s /tmp/plate.nc
          grep -q M30 /tmp/plate.nc
      - name: the shipped face is inside the wheel
        run: |
          /tmp/fresh/bin/python -c "from dragpoint.font.library import shipped_names; \
            assert 'panelgothic' in shipped_names(), shipped_names()"

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m dragpoint.cli.main job check examples/mcc-panel-7.toml
      - run: python -m dragpoint.cli.main job summary examples/mcc-panel-7.toml
      - run: python -m dragpoint.cli.main job nest examples/mcc-panel-7.toml
      - run: python -m dragpoint.cli.main job time examples/mcc-panel-7.toml
      - run: python -m dragpoint.cli.main job post examples/mcc-panel-7.toml --out /tmp/programs
      - name: every plate came out as a program
        run: |
          test "$(ls /tmp/programs | wc -l)" -eq 7
          for file in /tmp/programs/*.nc; do grep -q M30 "$file"; done

  release:
    runs-on: ubuntu-latest
    needs: [lint, checks, generated, tests, coverage, packaging, example]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m dragpoint.tools.release_check --verbose
