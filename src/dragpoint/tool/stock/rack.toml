# What the rack holds.
#
# Names are the ones printed on the stock label, because that is what the
# drawing office writes on a schedule and what the operator reads off the
# sheet before it goes on the bed.
#
# thickness, cap and nominal are millimetres. cap is left out for solid
# stock, which has no cap to cut through and therefore no floor on the
# depth. feed and plunge are millimetres per minute, and spindle is rpm,
# because those are the units the controllers take.
#
# The numbers here are what this shop cuts, arrived at by cutting it. A
# shop with a different spindle or a different cutter supplier wants its
# own file, which is why this is a file rather than a table in the source.

