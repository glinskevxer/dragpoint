# Legend plates for the number 7 motor control centre.
#
# Every distance in here can carry a unit. The customer works in inches and
# the switch bore came off their drawing, so it is written the way they sent
# it and converted on the way in.

[job]
name = "MCC-7"
# The fine cutter, not the general purpose one. Most of this panel is at
# 3 mm and a thirty degree cutter with a fifteen thou tip leaves a groove
# wide enough to close the tightest letter pairs at that size.
cutter = "V20-010"
post = "iso"
spring_pass = false
notes = "Cut after the panel is drilled, the bores are the datum."

[job.sheet]
stock = "LAM16-BW"
width = "300mm"
height = "600mm"
margin = "6mm"
kerf = "1.5mm"

[defaults]
stock = "LAM16-BW"
face = "panelgothic"
cap_height = "3mm"
margin = "2mm"
halign = "centre"
valign = "middle"
fit = "condense"

[[plate]]
name = "P-101"
size = ["60mm", "20mm"]
lines = ["FEED PUMP 1", "RUN"]
quantity = 2

[[plate]]
name = "P-102"
size = ["60mm", "20mm"]
lines = ["FEED PUMP 2", "RUN"]
quantity = 2

[[plate]]
name = "P-103"
size = ["60mm", "20mm"]
lines = ["FEED PUMP 3", "RUN"]
quantity = 2

[[plate]]
name = "P-110"
size = ["100mm", "40mm"]
lines = ["EMERGENCY STOP"]
cap_height = "5mm"
stock = "LAM32-RW"
margin = "6mm"
border = "2.5mm"
fit = "both"

# The mushroom head sits proud of this one, so the legend goes under the
# bore rather than round it and the plate is square.
[[plate]]
name = "P-111"
size = ["60mm", "60mm"]
lines = ["STOP"]
cap_height = "5mm"
stock = "LAM32-RW"
margin = "4mm"
valign = "bottom"

  [[plate.feature]]
  name = "bore"
  kind = "bore"
  at = ["30mm", "38mm"]
  diameter = "0.875in"
  clearance = "1.5mm"

# Screwed to the door rather than clipped, so it carries its own fixing
# holes and the legend has to stay between them.
[[plate]]
name = "P-120"
size = ["120mm", "25mm"]
lines = ["INCOMER 400V 3PH", "ISOLATE BEFORE WORKING"]
tracking = "0.15mm"

  [[plate.feature]]
  name = "fix-left"
  kind = "hole"
  at = ["6mm", "12.5mm"]
  diameter = "4.2mm"
  clearance = "1mm"

  [[plate.feature]]
  name = "fix-right"
  kind = "hole"
  at = ["114mm", "12.5mm"]
  diameter = "4.2mm"
  clearance = "1mm"

[[plate]]
name = "P-130"
size = ["45mm", "12mm"]
lines = ["LOCAL"]
cap_height = "4mm"
stock = "ANOD-10"
quantity = 6
tags = ["spares"]
